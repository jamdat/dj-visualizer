name: Build and Release DJ Visualizer (Windows + macOS Apple Silicon)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Windows x64 Standalone Build
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Determine Release Version
        id: version
        shell: pwsh
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $ver = $env:GITHUB_REF_NAME
          } else {
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            $ver = "v1.0.0-$shortSha"
          }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure CMake (Windows x64)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DDJVISUALIZER_VERSION="${{ env.VERSION }}" -DDJVISUALIZER_GITHUB_REPO="${{ github.repository }}"

      - name: Build Release Binary (Windows x64)
        run: |
          cmake --build build --config Release

      - name: Package Standalone Windows Deliverable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/DJVisualizer
          if (Test-Path build/bin/DJVisualizer.exe) {
            Copy-Item -Path build/bin/DJVisualizer.exe -Destination dist/DJVisualizer/
          } elseif (Test-Path build/bin/Release/DJVisualizer.exe) {
            Copy-Item -Path build/bin/Release/DJVisualizer.exe -Destination dist/DJVisualizer/
          }
          Copy-Item -Path src/shaders -Destination dist/DJVisualizer/src/ -Recurse -Force
          if (Test-Path presets) { Copy-Item -Path presets -Destination dist/DJVisualizer/ -Recurse -Force }
          if (Test-Path README.md) { Copy-Item -Path README.md -Destination dist/DJVisualizer/ -Force }

          Compress-Archive -Path dist/DJVisualizer -DestinationPath DJVisualizer-Windows-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 DJVisualizer-Windows-x64.zip).Hash.ToLower()
          "$hash  DJVisualizer-Windows-x64.zip" | Out-File -FilePath sha256-win.txt -Encoding ascii

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJVisualizer-Windows-x64
          path: |
            DJVisualizer-Windows-x64.zip
            sha256-win.txt

  # ---------------------------------------------------------------------------
  # 2. macOS Apple Silicon (ARM64) Standalone .app Bundle Build
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Release Version
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="$GITHUB_REF_NAME"
          else
            SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
            VER="v1.0.0-${SHORT_SHA}"
          fi
          echo "VERSION=${VER}" >> $GITHUB_ENV

      - name: Configure CMake (macOS Apple Silicon ARM64)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DDJVISUALIZER_VERSION="${{ env.VERSION }}" -DDJVISUALIZER_GITHUB_REPO="${{ github.repository }}"

      - name: Build Release App Bundle (macOS ARM64)
        run: |
          cmake --build build --config Release -j4

      - name: Package Standalone macOS Deliverable (.app + 1-Click Gatekeeper Bypass Launcher)
        run: |
          mkdir -p dist_mac
          if [ -d "build/bin/DJVisualizer.app" ]; then
            cp -R "build/bin/DJVisualizer.app" dist_mac/
          elif [ -d "build/bin/Release/DJVisualizer.app" ]; then
            cp -R "build/bin/Release/DJVisualizer.app" dist_mac/
          fi

          # Ad-hoc code sign the bundle so macOS Apple Silicon executes it cleanly
          codesign --force --deep --sign - dist_mac/DJVisualizer.app

          # Create 1-click Mac launcher that strips Gatekeeper quarantine and opens the app
          cat << 'EOF' > dist_mac/Launch_DJVisualizer_Mac.command
          #!/bin/bash
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          xattr -cr "$DIR/DJVisualizer.app" 2>/dev/null || true
          open "$DIR/DJVisualizer.app"
          EOF
          chmod +x dist_mac/Launch_DJVisualizer_Mac.command

          cd dist_mac
          zip -r -y ../DJVisualizer-macOS-arm64.zip DJVisualizer.app Launch_DJVisualizer_Mac.command
          cd ..
          shasum -a 256 DJVisualizer-macOS-arm64.zip > sha256-mac.txt

      - name: Upload macOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJVisualizer-macOS-arm64
          path: |
            DJVisualizer-macOS-arm64.zip
            sha256-mac.txt

  # ---------------------------------------------------------------------------
  # 3. Publish Combined GitHub Release (Supports In-App Auto-Updater)
  # ---------------------------------------------------------------------------
  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Determine Release Tag
        id: rel
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
            TAG="v1.0.0-${SHORT_SHA}"
          fi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Generate Combined SHA256 Checksums
        run: |
          cat sha256-win.txt sha256-mac.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.TAG }}
          name: "DJ Visualizer ${{ steps.rel.outputs.TAG }} (Windows x64 & macOS Apple Silicon)"
          body: |
            ### 🎧 DJ Audio-Reactive Visualizer (${{ steps.rel.outputs.TAG }})
            - **macOS (Apple Silicon M1/M2/M3/M4)**: Download `DJVisualizer-macOS-arm64.zip`, unzip, and double-click `Launch_DJVisualizer_Mac.command` (or `DJVisualizer.app`).
            - **Windows (64-bit)**: Download `DJVisualizer-Windows-x64.zip`, unzip, and run `DJVisualizer.exe`.
            - **Auto-Updates**: Existing installations will automatically detect this release via the **Check Updates / Install Update** button in the top bar.
          files: |
            DJVisualizer-Windows-x64.zip
            DJVisualizer-macOS-arm64.zip
            SHA256SUMS.txt
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

